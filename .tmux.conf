# ==============================================================================
# Prefix
# ==============================================================================

unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Ghostty supports the extended keyboard protocol (needed to distinguish
# Ctrl+<digit> from a plain digit, since it has no legacy escape sequence).
# extended-keys alone isn't enough: tmux reports as "xterm-ghostty", which
# matches its built-in xterm* feature set, and that set doesn't include
# extkeys -- so tmux never negotiates the protocol with Ghostty at all
# without this being added explicitly.
set -g extended-keys on
set -as terminal-features ',xterm-ghostty:extkeys'

# ==============================================================================
# Plugins
# ==============================================================================

# Gray theme overrides for catppuccin (must be set before the plugin runs,
# since it uses set-if-unset semantics for these variables). Matches the
# Ghostty dark-gray theme; accent colors are left as catppuccin defaults so
# status indicators (bell, activity, prefix) stay distinguishable.
set -g @thm_bg "#1a1a1a"
set -g @thm_fg "#d8d8d8"
set -g @thm_mantle "#141414"
set -g @thm_crust "#0f0f0f"
set -g @thm_surface_0 "#262626"
set -g @thm_surface_1 "#333333"
set -g @thm_surface_2 "#404040"
set -g @thm_overlay_0 "#4d4d4d"
set -g @thm_overlay_1 "#5c5c5c"
set -g @thm_overlay_2 "#6b6b6b"
set -g @thm_subtext_0 "#b0b0b0"
set -g @thm_subtext_1 "#c2c2c2"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_left_separator "X"
set -g @catppuccin_window_right_separator "Y"

bind-key Space next-layout

# ==============================================================================
# Copy mode
# ==============================================================================

set -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ==============================================================================
# Status bar
# ==============================================================================

set -g default-terminal "tmux-256color"

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

set -g status-left "#{E:@catppuccin_status_session} "
# set inactive/active window styles
# set the pane border colors
set -g pane-border-style 'fg=colour235,bg=default'
set -g pane-active-border-style 'fg=colour51,bg=red'

set -g status-right "#{?pane_in_mode,#[fg=#0f0f0f bg=#a6e3a1 bold] COPY ,}#{?client_prefix,#[fg=#0f0f0f bg=#cba6f7 bold] C-s ,}"

# ==============================================================================
# Mouse
# ==============================================================================

set -g mouse on

# ==============================================================================
# Vim pane navigation
# ==============================================================================

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ==============================================================================
# Open new panes/windows in current directory
# ==============================================================================

bind r source-file ~/.tmux.conf \; display-popup -d "#{pane_current_path}" -h 3 -w 20 -y S "echo 'Config reloaded'"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ==============================================================================
# Notifications
# ==============================================================================

set -g bell-action any
setw -g monitor-bell on
set -g visual-bell both
set -g allow-passthrough on

# ==============================================================================
# Misc
# ==============================================================================

set -g allow-rename off
set -g automatic-rename off
set-hook -g pane-focus-in "run-shell -b '~/.config/tmux/smart-rename.sh'"
set-hook -g after-new-window "run-shell -b '~/.config/tmux/smart-rename.sh'"
set -g base-index 1
set -sg escape-time 0
set -g repeat-time 300
set -g history-limit 50000
set -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S · #W"

set-environment -g TMUX_PLUGIN_MANAGER_PATH '/opt/homebrew/opt/tpm/share/tpm/plugins/'
run '/opt/homebrew/opt/tpm/share/tpm/tpm'

# Must come after plugins to override catppuccin's background
set -g window-active-style 'fg=default,bg=terminal'
set -g window-style 'fg=default,bg=terminal'
