# ==============================================================================
# Prefix
# ==============================================================================

unbind C-b
set -g prefix C-s
bind C-s send-prefix

# ==============================================================================
# Plugins
# ==============================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_left_separator "X"
set -g @catppuccin_window_right_separator "Y"

bind-key Space next-layout

# ==============================================================================
# Copy mode
# ==============================================================================

set -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ==============================================================================
# Status bar
# ==============================================================================

set -g default-terminal "tmux-256color"

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

set -g status-left "#{E:@catppuccin_status_session} "
# set inactive/active window styles
# set the pane border colors
set -g pane-border-style 'fg=colour235,bg=default'
set -g pane-active-border-style 'fg=colour51,bg=red'

set -g status-right "#{?pane_in_mode,#[fg=#1e1e2e bg=#a6e3a1 bold] COPY ,}#{?client_prefix,#[fg=#1e1e2e bg=#cba6f7 bold] C-s ,}"

# ==============================================================================
# Mouse
# ==============================================================================

set -g mouse on

# ==============================================================================
# Vim pane navigation
# ==============================================================================

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ==============================================================================
# Open new panes/windows in current directory
# ==============================================================================

bind r source-file ~/.tmux.conf \; display-popup -d "#{pane_current_path}" -h 3 -w 20 -y S "echo 'Config reloaded'"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ==============================================================================
# Misc
# ==============================================================================

set -g allow-rename off
set -g automatic-rename off
set-hook -g pane-focus-in "run-shell -b '~/.config/tmux/smart-rename.sh'"
set-hook -g after-new-window "run-shell -b '~/.config/tmux/smart-rename.sh'"
set -g base-index 1
set -sg escape-time 0
set -g repeat-time 300
set -g history-limit 50000
set -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S · #W"

set-environment -g TMUX_PLUGIN_MANAGER_PATH '/opt/homebrew/opt/tpm/share/tpm/plugins/'
run '/opt/homebrew/opt/tpm/share/tpm/tpm'

# Must come after plugins to override catppuccin's background
set -g window-active-style 'fg=default,bg=terminal'
set -g window-style 'fg=default,bg=colour235'
